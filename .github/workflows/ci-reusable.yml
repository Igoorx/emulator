name: Reusable Build

on:
  workflow_call:
    inputs:
      enable_deploy:
        required: false
        type: boolean
        default: false
      verbose:
        required: false
        type: string
        default: "false"

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulation-root:
    name: Windows 2025 Emulation Root
    runs-on: windows-2025
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Download DirectX Runtime
        run: curl --connect-timeout 20 --max-time 200 --retry 5 --retry-delay 2 --retry-max-time 200 -L -o directx_Jun2010_redist.exe https://download.microsoft.com/download/8/4/A/84A35BF1-DAFE-4AE8-82AF-AD2AE20B6B14/directx_Jun2010_redist.exe

      - name: Extract DirectX Runtime
        run: 'cmd /c "start /wait directx_Jun2010_redist.exe /Q /T:${{ github.workspace }}/dxrt"'

      - name: Install DirectX Runtime
        run: 'cmd /c "start /wait .\dxrt\dxsetup.exe /silent"'

      - name: Create emulation root
        run: src/tools/create-root.bat

      - name: Upload Windows 2025 emulation root
        uses: pyTooling/upload-artifact@v7
        with:
          name: Windows 2025 Emulation Root
          working-directory: root
          path: "*"
          retention-days: 1

  sspi-alpc-capture:
    name: SSPI ALPC Capture
    runs-on: windows-2025
    defaults:
      run:
        working-directory: sspi_alpc_capture
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Configure x64 capture utility
        run: cmake -S . -B build -A x64

      - name: Build release capture utility
        run: cmake --build build --config Release

      - name: Run live Schannel capture
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force capture -ErrorAction SilentlyContinue
          & .\build\Release\sspi_alpc_capture.exe 2>&1 |
            Tee-Object -FilePath capture_console.log
          $captureExitCode = $LASTEXITCODE
          Set-Content -Path capture_exit_code.txt -Value $captureExitCode
          "CAPTURE_EXIT_CODE=$captureExitCode" | Out-File -FilePath $env:GITHUB_ENV -Append
          exit 0

      - name: Upload SSPI ALPC capture results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sspi-alpc-capture-results-windows-x64
          path: |
            sspi_alpc_capture/capture
            sspi_alpc_capture/capture_console.log
            sspi_alpc_capture/capture_exit_code.txt
            sspi_alpc_capture/build/Release/sspi_alpc_capture.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce capture success
        if: always()
        shell: pwsh
        run: |
          if ($env:CAPTURE_EXIT_CODE -ne "0") {
            Write-Error "Capture utility exited with $env:CAPTURE_EXIT_CODE"
            exit 1
          }
